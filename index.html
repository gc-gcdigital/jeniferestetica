<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeni Freitas Estética</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#f4b8c1;--accent:#e8586f;--accent2:#c93f57;--bg:#fff;--ink:#2a2226;--muted:#6d5f64;--line:#f0dde1;--soft:#fdf1f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1416;--ink:#f6eef0;--muted:#bfaeb3;--line:#3a2c30;--soft:#251b1e}}
:root[data-theme="dark"]{--bg:#1a1416;--ink:#f6eef0;--muted:#bfaeb3;--line:#3a2c30;--soft:#251b1e}
html{background:var(--brand);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 16px/1.55 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
h1,h2{font-family:'Playfair Display',Georgia,serif;margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{background:linear-gradient(180deg,#f8c9d0,#fde9d9);color:#2a2226;text-align:center;padding:28px 24px 72px;clip-path:polygon(0 0,100% 0,100% calc(100% - 40px),0 100%)}
.hero img{width:min(300px,84%);height:auto;border-radius:20px;display:block;margin:0 auto 16px;box-shadow:0 8px 24px rgba(201,63,87,.2)}
.hero p{margin:0 0 22px;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;font-weight:700;font-size:17px}
.btn svg{width:22px;height:22px;flex:none;fill:currentColor}
.btn-wa{background:var(--accent2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
section{padding:28px 22px}
h2{font-size:28px;font-weight:700;margin-bottom:16px}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.svc li:last-child{border-bottom:1px solid var(--line)}
.svc .ic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.svc svg{width:22px;height:22px;fill:#fff}
.svc b{display:block;font-size:18px}
.svc div span{color:var(--muted);font-size:15px}
.work{background:#3a1f27;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:#552f3a}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.about{background:var(--soft)}
.about p{margin:0 0 12px;max-width:62ch}
.contact{background:linear-gradient(180deg,#f8c9d0,#f4b8c1);color:#2a2226;padding-bottom:36px}
.contact .list{display:grid;gap:12px}
.contact .btn{background:#fff;color:#2a2226}
.contact .btn.wa{background:var(--accent2);color:#fff}
footer{background:#f4b8c1;color:#2a2226;text-align:center;font-size:13px;padding:0 22px 22px}
</style>
</head>

<div class="wrap" id="app"></div>
